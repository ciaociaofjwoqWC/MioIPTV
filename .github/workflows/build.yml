name: Build APK
on:
  push:
    # Ricompila solo se cambia l'app Android, non a ogni modifica del sito.
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build.yml'
  workflow_dispatch:         # pulsante "Run workflow" per crearlo quando vuoi

permissions:
  contents: write            # serve per pubblicare l'APK nella pagina "Releases"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
      - run: mv app/build/outputs/apk/debug/app-debug.apk SpijTV.apk

      # L'APK finisce sempre allo stesso indirizzo, scaricabile anche dalla TV:
      # https://github.com/ciaociaofjwoqWC/MioIPTV/releases/latest/download/SpijTV.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Spij TV (ultima versione)
          make_latest: true
          files: SpijTV.apk
