name: Aggiorna canali e guida programmi
on:
  schedule:
    - cron: '0 */6 * * *'   # ogni 6 ore
  workflow_dispatch:         # pulsante "Run workflow" per farlo subito

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Elenco canali con le sorgenti di riserva
      - name: Prepara channels.json
        run: python tools/build_channels.py

      # Scarica la guida completa e salva in epg.json solo i canali della playlist
      - name: Prepara epg.json
        run: python tools/build_epg.py

      - name: Salva nel repository se qualcosa è cambiato
        run: |
          git config user.name "epg-bot"
          git config user.email "epg-bot@users.noreply.github.com"
          git add epg.json channels.json
          git diff --staged --quiet || git commit -m "Aggiorna guida programmi $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
